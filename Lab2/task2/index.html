<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Instagram login page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="logotip">
  <img src="https://images.seeklogo.com/logo-png/30/2/instagram-new-2016-logo-png_seeklogo-302599.png" alt="logotip" height="50px">
</div>

<div class="page">
  <div class="left">
    <h1>See everyday moments from your close friends.</h1>
    <img src="https://static.cdninstagram.com/rsrc.php/v4/yF/r/reN9rvYdLTB.png" alt="intro" height="500px">
  </div>

  <div class="right">
      <h4>Log into Instagram</h4>
      <input type="text" placeholder="Mobile number, username or email">
      <input type="password" placeholder="Password">
      <button class="login">Log in</button>
      <a href="#">Forgot password?</a>
        <a href="#">
          <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/0/05/Facebook_Logo_%282019%29.png/500px-Facebook_Logo_%282019%29.png" alt="facebook logo" height="20px">
          <p>Log in with Facebook</p>
        </a>
      <button class="new-account">Create new account</button>
        <img src="https://cdn.pixabay.com/photo/2021/12/14/22/29/meta-6871457_1280.png" alt="meta" height="30px">
        <p>Meta</p>
  </div>
</div>
</body>
</html>
